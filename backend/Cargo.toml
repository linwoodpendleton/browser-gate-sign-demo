[package]
name = "qlvm-backend-demo"
version = "0.1.0"
edition = "2021"
description = "研究用 demo:/getQueryList 的 HMAC 环境门禁验签后端。请勿照抄到生产。"
license = "MIT"

[dependencies]
axum = "0.7.9"
tokio = { version = "1.42.0", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.6.2", features = ["cors"] }
hmac = "0.12.1"
sha2 = "0.10.8"
hex = "0.4.3"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
